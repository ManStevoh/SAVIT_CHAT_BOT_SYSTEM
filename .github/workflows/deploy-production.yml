name: Deploy to production

# Fully automated: merge/push to main → tests → cPanel git deploy → health check.
on:
  push:
    branches: [main]
    paths:
      - 'LARAVEL_BACKEND/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy on the cPanel server
        required: true
        default: main
        type: string
      skip_health_check:
        description: Skip post-deploy health check
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy main to relayiq.app
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://relayiq.app
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger cPanel deploy
        env:
          DEPLOY_AGENT_KEY: ${{ secrets.DEPLOY_AGENT_KEY }}
          DEPLOY_REMOTE_URL: ${{ secrets.DEPLOY_REMOTE_URL }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: bash .github/scripts/trigger-agent-deploy.sh

      - name: Health check
        if: ${{ github.event.inputs.skip_health_check != true }}
        run: bash .github/scripts/health-check.sh https://relayiq.app

      - name: Tag successful production deploy
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="deploy-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          git tag -a "$TAG" -m "Production deploy ${GITHUB_SHA}"
          git push origin "$TAG"
          echo "Created rollback tag ${TAG}"
