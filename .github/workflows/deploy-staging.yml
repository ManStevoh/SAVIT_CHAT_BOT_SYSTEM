name: Deploy to staging

# Optional. Enable later with repo variable STAGING_ENABLED=true and secret STAGING_DEPLOY_AGENT_KEY.
on:
  push:
    branches: [develop]
    paths:
      - 'LARAVEL_BACKEND/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to deploy to staging
        required: true
        default: develop
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to staging.relayiq.app
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_ENABLED == 'true' }}
    environment:
      name: staging
      url: https://staging.relayiq.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger staging deploy
        env:
          DEPLOY_AGENT_KEY: ${{ secrets.STAGING_DEPLOY_AGENT_KEY }}
          DEPLOY_REMOTE_URL: ${{ secrets.STAGING_DEPLOY_URL }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || github.ref_name }}
        run: bash .github/scripts/trigger-agent-deploy.sh

      - name: Health check
        env:
          STAGING_URL: ${{ secrets.STAGING_DEPLOY_URL }}
        run: bash .github/scripts/health-check.sh "${STAGING_URL:-https://staging.relayiq.app}"
