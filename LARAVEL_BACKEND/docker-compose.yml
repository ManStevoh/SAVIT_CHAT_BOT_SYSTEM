services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: essemchat_app
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - APP_URL=http://localhost:8080
      - FRONTEND_URL=http://localhost:8080
